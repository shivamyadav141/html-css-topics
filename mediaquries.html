<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Quries</title>
    <style>
        .box{
            color: white;
           background-color: red;
           font-size: 50px;
           text-align: center;
           display: none;
        }

        @media(max-width:500px) {
            #box1{
                display: block;
                background-color: tomato;
            }
        }

         @media(min-width:500px) and (max-width:600px) {
            #box2{
                display: block;
                background-color: aqua;
            }
        }

          @media(min-width:700px) and (max-width:900px) {
            #box3{
                display: block;
                background-color:yellow;
            }
        }

          @media(min-width:900px) and (max-width:1100px) {
            #box4{
                display: block;
                background-color:green;
            }
        }
    </style>
</head>
<body>
    <div class="box" id="box1">Me ek iphone hu</div>
    <div class="box" id="box2">Me ek Tablet hu</div>
    <div class="box" id="box3">Me ek computer hu</div>
    <div class="box" id="box4">Me ek wide screen computer hu</div>
</body>
</html>
