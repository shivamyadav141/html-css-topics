<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visibility and  z-index</title>
    <style>
        .box{
            width:170px;
            height:170px;
            border:2px solid red;
            margin: 10px;
        }
#box1{background-color: blue;
    /* display: none; both hide element and space*/
}

#box2{background-color: brown;
    position: relative;
    top: 49px;
    z-index: -15;
}
#box3{background-color: green;
   /* visibility: hidden;    will hide the element but will show empty space*/
   position: absolute;
   top: 76px;
   z-index: -16px;             /* z index property work only in relative, absolute, fixed, sticky*/
}
#box4{background-color: yellow;
}



    </style>

</head>
<body>
<div class="box" id="box1"></div>
<div class="box" id="box2"></div>
<div class="box" id="box3"></div>
<div class="box" id="box4"></div>
</html>
