<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>heights,Weight,Border,and backgrounds</title>
    <style>
        #firstpara{
            background-color: red;
            height: 80px;
            width: 1000px;
         /*   border-color: green;
            border-width: 3px;
           border-style: solid;*/
           border-radius: 13px;
           border:3px,solid,green
        }

         #secondpara{
            background-color: green;
             height: 80px;
             width: 1000px;
             border-top: 2px solid red;
             border-bottom : 2px solid blue;
             border-top-left-radius: 4px;
             border-top-right-radius:  4px;
             
         }
         #thirdpara{
            height: 800px;
            width: 1000;
            background-image: url(https://techpp.com/wp-content/uploads/2025/09/Download-Wallpaper.jpg);
            border: 2px solid red;
            background-repeat: no-repeat;/* repet-x and repet-y will make repet on x and y axis*/
            background-position: top right;
          /*  background-position: too centre;
            background-position: centre left;*/

         }
    </style>
</head>
<body>
    <h3> This is heading</h3>
    <p id="firstpara">this is a paragraph</p>
    <h3> This is second heading</h3>
    <p id="secondpara">this is a paragraph</p>

        <h3> This is third heading</h3>
    <p id="thirdpara">this is a paragraph</p>

</body>
</html>
