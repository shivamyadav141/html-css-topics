<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block elements</title>
</head>
<body>
<p style="border:2px solid rgb(89, 12, 12);">this is a paragraph</p> <p style="border:2px solid green">this is also a paragraph</p>
<span style="border:2px solid green;">this is a paragraph</span> 
</body>
</html>
<!-- 
. Inline CSS	     Directly HTML tag ke andar likha jata hai style attribute ke sath.	
2. Internal CSS           	HTML ke <head> section me <style> tag ke andar likha jata hai.
3. External CSS	          Alag .css file me likha jata hai aur HTML me <link> se connect karte hain.	 -->
