<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute and nth child pseudo selectors</title>
    <style>
        .container{
         display: block;
         width: 233px;
         margin:auto;       /* element centre me aata hai*/
        }

    a[target]{
        font-size: 44px;
        color: rgb(186, 13, 13);
    }


       /* input[type="text"]{
        margin: 233px;   
        border: 2px soid red;  
   }*/



  /* this will apply css for 3rd child*/
    li:nth-child(3){
color: aqua;
    }

     /*  har dusare pe color red ho gayega*/
    li:nth-child(2n+0){
        color: red;
    }
    </style>
</head>
<body>
    <div class="container">
        <h1><a href="https//google.com" target="_blank">Go to the google</a></h1>
<form action="" class="form-control">
    <input type="text" placeholder ="Enter your name">
    <input type="password" placeholder="Enter your password"> 
    <input type="submit">
</form>   

    <ul>
        <li class="item" id="item1">Item-1</li>
        <li class="item" id="item2">Item-2</li>
        <li class="item" id="item3">Item-3</li>
        <li class="item" id="item4">Item-4</li>
        <li class="item" id="item5">Item-5</li>
        <li class="item" id="item6">Item-6</li>
        <li class="item" id="item7">Item-7</li>
        <li class="item" id="item8">Item-8</li>
        <li class="item" id="item9">Item-9</li>
        <li class="item" id="item10">Item10</li>
        <li class="item" id="item11">Item-11</li>
        <li class="item" id="item12">Item-12</li>
        <li class="item" id="item13">Item-13</li>
        <li class="item" id="item14">Item-14</li>
        <li class="item" id="item15">Item-15</li>
        <li class="item" id="item16">Item-16</li>
        <li class="item" id="item17">Item-17</li>
        
        </ul>
    </div>
</body>
</html>
