<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        CSS FONTS
    </title>
    <style>
        P{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size:23px;
            line-height:1em;
            
     }

span{
    font-weight: Shivam;
    font-style: italic;
}
    </style>
</head>
<body>
    <h3> CSS Fonts</h3>
    <p>Lets play with <span>Shivam</span> fonts , its very exciting </p>
</body>
</html>

<!-- . Inline CSS	     Directly HTML tag ke andar likha jata hai style attribute ke sath.	
2. Internal CSS           	HTML ke <head> section me <style> tag ke andar likha jata hai.
3. External CSS	          Alag .css file me likha jata hai aur HTML me <link> se connect karte hain.	 -->
