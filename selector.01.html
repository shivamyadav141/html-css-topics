<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selectors</title>
    <style>
      /*  Element selectors*/
        p{
            border: 2px solid violet ;
        }
       /* Id selectors*/
        #redElement{
            color:red;
        }
        /* Class selectors*/
    .bgBlue{
        color:yellow;
        background-color: blue;
    }
    .voiletElement{
        color: blue;
        background-color: aqua;
    }
    /*Grouping selectors*/
    footer , span {
    background-color: pink;
    }
    </style>
</head>
<body>
    <h3> CSS selectors </h3>
    <p class="redElement bgBlue"> this is a simple paragraph to demonstrate css </p>
    <p id="redElement">this is a also simple paragraph to demonstrate css </p>
    <div>
    <p class="voiletElement bgGreen"> this is yet another a simple paragraph to demonstrate css </p>
    <span>this is span</span>
    </div>
    <footer>
        This is a footer
    </footer>
</body>
</html>
