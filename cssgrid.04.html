<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .container{
        display: grid;
        grid-template-columns: repeat(5,1fr);
        grid-template-rows:repeat(4,1fr);
        grid-gap:1rem;
        }
        .box{
        border:2px solid black;
        background-color: rgb(167, 103, 226);
        padding: 13px;
        }
        .box:first-child{
           /* grid-column-start: 1;/* do column ko jod kar deta hai*/
           /* grid-column-end: 3;*/
          /* grid-column: 1/span3;*/
           grid-row:1/span3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">item1</div>
        <div class="box">item2</div>
        <div class="box">item3</div>
        <div class="box">item4</div>
        <div class="box">item5</div>
        <div class="box">item6</div>
        <div class="box">item7</div>
        <div class="box">item8</div>
        <div class="box">item9</div>
        <div class="box">item10</div>
        <div class="box">item11</div>
        <div class="box">item12</div>
        <div class="box">item13</div>
        <div class="box">item14</div>
        <div class="box">item15</div>
        <div class="box">item16</div>
        <div class="box">item17</div>
    </div>
</body>
</html>
